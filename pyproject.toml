[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clashctl"
version = "0.1.0"
description = "TUI for the Clash proxy RESTful API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Zixuan Tan" }]
dependencies = [
    "textual>=0.85",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tomli-w>=1.0",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-textual-snapshot>=0.4",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
clashctl = "clashctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clashctl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
